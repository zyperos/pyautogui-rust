[build-system]
requires = [
    "setuptools>=77",
    "setuptools-rust>=1.11,<2",
    "wheel>=0.45",
]
build-backend = "setuptools.build_meta"

[project]
name = "pyautogui-rust"
version = "0.9.54.1"
description = "Cross-platform GUI automation with an optional Rust-accelerated Windows backend"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Al Sweigart", email = "al@inventwithpython.com" },
]
maintainers = [
    { name = "zhai" },
]
keywords = [
    "automation",
    "gui",
    "keyboard",
    "mouse",
    "rust",
    "testing",
    "windows",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mouseinfo>=0.1.3",
    "pillow>=9.3",
    "pygetwindow>=0.0.5",
    "pymsgbox>=1.0.9",
    "pyscreeze>=0.1.21",
    "pytweening>=1.0.4",
    "pyobjc-core; platform_system == 'Darwin'",
    "pyobjc-framework-Quartz; platform_system == 'Darwin'",
    "python3-Xlib; platform_system == 'Linux'",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.9",
]
benchmark = [
    "pytest-benchmark>=5",
]
vision = [
    "mss>=9",
    "numpy>=1.24",
    "opencv-python>=4.8",
]

[project.scripts]
pyautogui = "pyautogui._cli:main"

[project.urls]
Documentation = "https://github.com/zyperos/pyautogui-rust#readme"
Issues = "https://github.com/zyperos/pyautogui-rust/issues"
Repository = "https://github.com/zyperos/pyautogui-rust"

[tool.setuptools]
include-package-data = true
packages = ["pyautogui"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
minversion = "8.3"
testpaths = ["tests/unit"]
markers = [
    "benchmark: opt-in microbenchmarks that never emit operating-system input",
    "integration: tests that require a built native extension",
]

[tool.coverage.run]
branch = true
source = ["pyautogui"]
omit = [
    "pyautogui/__main__.py",
    "pyautogui/_cli.py",
    "pyautogui/_pyautogui_*.py",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = [
    "build",
    "dist",
    "target",
    "tests/test_automateboringstuff.py",
    "tests/test_pyautogui.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.black]
line-length = 120
skip-string-normalization = true

