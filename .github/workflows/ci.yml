name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,benchmark]"
      - name: Python checks
        run: python -m pytest --cov=pyautogui --cov-report=term-missing:skip-covered --cov-fail-under=60
      - name: Rust checks
        run: |
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings

  package:
    name: Build and validate release artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Build distributions
        run: python -m pip install --upgrade pip build && python -m build
      - name: Validate distributions
        run: python tools/verify_dist.py dist
      - name: Smoke test installed wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem "$env:GITHUB_WORKSPACE\dist\*.whl" | Select-Object -First 1 -ExpandProperty FullName
          python -m pip install --force-reinstall $wheel
          Set-Location $env:RUNNER_TEMP
          python "$env:GITHUB_WORKSPACE\tools\smoke_installed.py"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
