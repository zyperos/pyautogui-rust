name: Bug report
description: Report a reproducible behavior problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: Reproduction
      description: Provide the smallest script and the observed result.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Include pyautogui-rust version, Python version, OS, and display setup.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true
